<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | Bug Away</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">

<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{META_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:site_name" content="Bug Away">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{META_DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<link rel="stylesheet" href="/blog/blog.css">
{{JSON_LD}}
</head>
<body>
{{HEADER}}

<main class="post">
  <article>
    <header class="post-head">
      <a class="post-back" href="/blog">All articles</a>
      <h1 class="post-title">{{HEADING}}</h1>
      <time class="post-date" datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time>
    </header>

    {{HERO}}

    <div class="post-body">
      {{CONTENT}}
    </div>
  </article>

  <aside class="post-cta">
    <h2>Chemical-free tick protection</h2>
    <p>No permethrin to wash out. No-see-um-grade mesh keeps ticks, mosquitoes and black flies out because they physically cannot get through the weave.</p>
    <a class="post-cta-btn" href="/shop">Shop the gear</a>
  </aside>
</main>

{{FOOTER}}
</body>
</html>
