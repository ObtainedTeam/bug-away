# CodeQL: statische codeanalyse op bekende kwetsbaarheden (XSS, injecties,
# onveilige redirects). Draait los van Vercel en blokkeert de deploy niet;
# bevindingen staan onder Security > Code scanning.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
